name: Setup Clojure
description: Install Java 25, Clojure CLI, and restore dependency caches.

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'

    - name: Install native LMDB
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y liblmdb0

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@12.5
      with:
        cli: latest

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: ${{ runner.os }}-clojure-
